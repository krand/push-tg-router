<style>
#push-router-preview { padding:24px 8px; background-color:transparent; }
#push-router-preview .pr-phone { --pr-bg:light-dark(#f7f8fa,#14181d); --pr-paper:light-dark(#ffffff,#20252d); --pr-ink:light-dark(#202a35,#edf1f5); --pr-muted:light-dark(#626e7e,#abb6c4); --pr-line:light-dark(#e1e5eb,#363d47); --pr-blue:light-dark(#2456b8,#a7c4ff); --pr-bluefill:light-dark(#e9effc,#263b5d); --pr-button:light-dark(#254fa6,#a7c4ff); --pr-buttonink:light-dark(#ffffff,#102c58); --pr-green:light-dark(#176247,#a3dfc2); --pr-greenfill:light-dark(#e7f3ed,#1e3c31); --pr-red:light-dark(#a3333a,#ffa8ae); --pr-gap:16px; font-family:Inter,Roboto,system-ui,sans-serif; font-size:14px; line-height:1.5; color:var(--pr-ink); background:var(--pr-bg); width:100%; max-width:420px; margin:auto; border:1px solid var(--pr-line); border-radius:28px; box-sizing:border-box; overflow:hidden; }
#push-router-preview * { box-sizing:border-box; }
#push-router-preview strong { font-weight:500; }
#push-router-preview button, #push-router-preview input, #push-router-preview select { font:inherit; }
#push-router-preview button { color:inherit; }
#push-router-preview .pr-system { display:flex; justify-content:space-between; padding:15px 22px 9px; font-size:11px; font-weight:500; }
#push-router-preview .pr-brand { display:flex; gap:9px; align-items:center; padding:12px 20px 18px; font-size:17px; font-weight:500; }
#push-router-preview .pr-mark { display:grid; place-items:center; width:40px; height:40px; flex-shrink:0; }
#push-router-preview .pr-mark img { display:block; width:100%; height:100%; object-fit:contain; }
#push-router-preview .pr-brand .pr-text { margin-left:auto; }
#push-router-preview .pr-content { padding:0 18px 22px; min-height:525px; }
#push-router-preview .pr-title { display:flex; gap:12px; justify-content:space-between; align-items:center; margin:8px 0 18px; }
#push-router-preview h1 { font-size:26px; font-weight:500; line-height:1.2; margin:0 0 6px; letter-spacing:-.8px; }
#push-router-preview h2 { font-size:16px; font-weight:500; margin:0 0 5px; }
#push-router-preview p { margin:0; }
#push-router-preview .pr-secondary { color:var(--pr-muted); font-size:12px; }
#push-router-preview .pr-small { font-size:12px; }
#push-router-preview .pr-kicker { color:var(--pr-muted); font-size:11px; font-weight:500; letter-spacing:.9px; text-transform:uppercase; margin:20px 0 10px; }
#push-router-preview .pr-banner { border-radius:12px; padding:12px; display:flex; gap:9px; align-items:center; background:var(--pr-bluefill); color:var(--pr-blue); margin-bottom:16px; font-size:12px; }
#push-router-preview .pr-banner svg { flex-shrink:0; }
#push-router-preview .pr-filters { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px; }
#push-router-preview .pr-pill { border:1px solid var(--pr-line); background:var(--pr-paper); padding:6px 13px; border-radius:20px; font-size:12px; min-height:34px; }
#push-router-preview .pr-pill[aria-pressed="true"] { background:var(--pr-ink); color:var(--pr-bg); border-color:var(--pr-ink); }
#push-router-preview .pr-card { border:1px solid var(--pr-line); border-radius:16px; padding:var(--pr-gap); background:var(--pr-paper); margin-bottom:10px; }
#push-router-preview .pr-row { display:flex; gap:11px; align-items:center; min-width:0; }
#push-router-preview .pr-row > .pr-grow { flex:1; min-width:0; }
#push-router-preview .pr-row.pr-wrap { flex-wrap:wrap; }
#push-router-preview .pr-app { width:36px; height:36px; background:var(--pr-bluefill); color:var(--pr-blue); border-radius:11px; display:grid; place-items:center; flex-shrink:0; font-size:16px; font-weight:500; }
#push-router-preview .pr-notification { width:100%; display:block; text-align:left; }
#push-router-preview .pr-notification:hover { border-color:var(--pr-blue); }
#push-router-preview .pr-notification .pr-message { margin-top:11px; }
#push-router-preview .pr-notification h2 { font-size:14px; margin:0 0 3px; }
#push-router-preview .pr-status { display:inline-flex; gap:5px; align-items:center; font-size:11px; margin-top:12px; color:var(--pr-green); }
#push-router-preview .pr-status.pr-idle { color:var(--pr-muted); }
#push-router-preview .pr-tag { font-size:11px; color:var(--pr-green); background:var(--pr-greenfill); padding:3px 8px; border-radius:8px; white-space:nowrap; }
#push-router-preview .pr-action { display:inline-flex; justify-content:center; align-items:center; gap:7px; background:var(--pr-button); color:var(--pr-buttonink); border:0; padding:12px 15px; min-height:44px; border-radius:12px; font-weight:500; }
#push-router-preview .pr-action.pr-subtle { background:var(--pr-paper); border:1px solid var(--pr-line); color:var(--pr-ink); }
#push-router-preview .pr-action:disabled { opacity:.45; }
#push-router-preview .pr-wide { width:100%; }
#push-router-preview .pr-text { background:transparent; border:0; padding:8px 4px; color:var(--pr-blue); font-size:12px; min-height:36px; }
#push-router-preview .pr-danger { color:var(--pr-red); }
#push-router-preview .pr-nav { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-top:1px solid var(--pr-line); background:var(--pr-paper); padding:8px 7px 0; }
#push-router-preview .pr-nav button { display:flex; flex-direction:column; align-items:center; gap:4px; border:0; background:transparent; padding:10px 1px; color:var(--pr-muted); font-size:11px; min-height:58px; }
#push-router-preview .pr-nav button[aria-current="page"] { color:var(--pr-blue); background:var(--pr-bluefill); border-radius:12px; }
#push-router-preview .pr-home { background:var(--pr-paper); padding:14px; display:flex; justify-content:center; }
#push-router-preview .pr-home span { width:95px; height:4px; border-radius:4px; background:var(--pr-ink); }
#push-router-preview .pr-label { display:block; font-size:12px; font-weight:500; margin:17px 0 7px; }
#push-router-preview input[type="text"], #push-router-preview input[type="password"], #push-router-preview select { background:var(--pr-paper); color:var(--pr-ink); border:1px solid var(--pr-line); padding:12px; border-radius:11px; width:100%; min-width:0; font-size:16px; }
#push-router-preview input[type="checkbox"] { accent-color:var(--pr-button); width:18px; height:18px; flex-shrink:0; }
#push-router-preview .pr-check { display:flex; align-items:center; gap:10px; padding:12px 0; min-height:44px; }
#push-router-preview .pr-line { height:1px; background:var(--pr-line); margin:16px 0; }
#push-router-preview .pr-space { margin-top:16px; }
#push-router-preview .pr-back { display:flex; align-items:center; gap:7px; margin:0 0 10px; }
#push-router-preview .pr-preview { padding:14px; background:var(--pr-bluefill); border-radius:12px; font-size:12px; margin:14px 0; overflow-wrap:anywhere; }
#push-router-preview .pr-qr { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; min-height:176px; margin:20px 0; }
#push-router-preview .pr-qr svg { width:128px; height:128px; }
#push-router-preview .pr-empty { padding:26px 0; color:var(--pr-muted); }
#push-router-preview .pr-error { color:var(--pr-red); margin:10px 0; font-size:12px; }
#push-router-preview .pr-notice { margin:14px 0; padding:11px; border-radius:10px; background:var(--pr-greenfill); color:var(--pr-green); font-size:12px; }
#push-router-preview .pr-switch { margin-left:auto; }
#push-router-preview .pr-long { overflow-wrap:anywhere; }
@media (max-width:360px) { #push-router-preview { padding:12px 0; } #push-router-preview .pr-content { padding:0 13px 18px; } #push-router-preview .pr-card { padding:12px; } #push-router-preview h1 { font-size:24px; } }
@media (pointer:coarse) { #push-router-preview .pr-text, #push-router-preview .pr-pill { min-height:44px; } }
</style>
<script>
(() => {
  const root = document.getElementById('push-router-preview');
  const content = root.querySelector('#pr-content');
  const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const samples = [
    {id:'n1',app:'Monobank',category:'Transactions',title:'Payment received',body:'₴2,450.00 from Acme Studio',time:'09:40',initial:'M',delivery:['p1']},
    {id:'n2',app:'Gmail',category:'Mail',title:'Acme Studio · Invoice approved',body:'Your October invoice is ready for payment.',time:'09:38',initial:'G',delivery:[]},
    {id:'n3',app:'Nova Post',category:'Deliveries',title:'Your parcel has arrived',body:'Parcel 2040 is ready at branch 12.',time:'09:31',initial:'N',delivery:['p2']},
    {id:'n4',app:'Gmail',category:'Mail',title:'Weekend reading',body:'The latest stories from your subscriptions.',time:'09:26',initial:'G',delivery:[]},
    {id:'n5',app:'Messages',category:'Messages',title:'Sensitive notification',body:'Content hidden by Android',time:'09:22',initial:'S',blocked:true,delivery:[]}
  ];
  let state = {version:1,tab:'notifications',filter:'all',paused:false,access:true,bot:'@my_push_router_bot',pairings:[{id:'p1',label:'My Telegram',name:'Alex',handle:'@alex_demo'},{id:'p2',label:'Family phone',name:'Marta',handle:'@marta_demo'}],routes:[{id:'r1',name:'Incoming payments',app:'Monobank',category:'Transactions',text:'Payment received',field:'title',targets:['p1'],enabled:true},{id:'r2',name:'Parcel updates',app:'Nova Post',category:'Deliveries',text:'',field:'any',targets:['p2'],enabled:true}]};
  let view = null, notice = '', draft = null, tokenStage = false;
  function restore(saved) { const s=saved?.privateContent?.state; if(s?.version===1 && Array.isArray(s.routes)&&Array.isArray(s.pairings)&&['notifications','routes','pairings','settings'].includes(s.tab)) { state=structuredClone(s); view=null; notice=''; } }
  restore(window.openai?.widgetState);
  function save() { if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{prototype:'Push Router',tab:state.tab,paused:state.paused,routes:state.routes.map(r=>({name:r.name,app:r.app,category:r.category,text:r.text,field:r.field,destinations:r.targets.map(id=>state.pairings.find(p=>p.id===id)?.label).filter(Boolean),enabled:r.enabled})),pairings:state.pairings.map(p=>({label:p.label}))},privateContent:{state}}).catch(()=>{}); }
  const btn=(label,action,extra='',subtle=false)=>`<button type="button" class="pr-action ${subtle?'pr-subtle ':''}cursor-interaction" data-action="${action}" ${extra}>${label}</button>`;
  const back=()=>`<button type="button" class="pr-text pr-back cursor-interaction" data-action="back">${icon('arrow-left')} Back</button>`;
  const heading=(title,subtitle)=>`<div class="pr-title"><div><h1>${title}</h1><p class="pr-secondary">${subtitle}</p></div></div>`;
  const labelList=ids=>ids.map(id=>state.pairings.find(p=>p.id===id)?.label).filter(Boolean).join(', ');
  const matches=(r,n)=>!n.blocked&&(r.app==='Any app'||r.app===n.app)&&(r.category==='Any category'||r.category===n.category)&&(!r.text|| (r.field==='title'?n.title:r.field==='body'?n.body:n.title+' '+n.body).toLocaleLowerCase().includes(r.text.toLocaleLowerCase()));
  const candidates=n=>[...new Set(state.routes.filter(r=>r.enabled&&matches(r,n)).flatMap(r=>r.targets))].filter(id=>state.pairings.some(p=>p.id===id));
  function routeDraft(n=null,r=null) { draft=r?structuredClone(r):{id:null,name:n?`${n.app} · ${n.category}`:'New route',app:n?.app||'Any app',category:n?.category||'Any category',field:'title',text:'',targets:[],enabled:true}; view={kind:'route',sample:n?.id}; notice=''; render(); }
  function render() {
    root.querySelector('#pr-global').textContent=state.paused?'Resume':'Pause';
    root.querySelectorAll('[data-tab]').forEach(b=>{if(b.dataset.tab===state.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    let html='';
    if(view?.kind==='detail') {
      const n=samples.find(n=>n.id===view.id), target=candidates(n);
      html=back()+heading('Notification',`${esc(n.app)} · ${esc(n.category)}`)+`<div class="pr-card"><h2>${esc(n.title)}</h2><p>${esc(n.body)}</p><p class="pr-secondary pr-space">Received today at ${n.time}</p></div><div class="pr-preview">${n.blocked?'Android has hidden this content. It will not be forwarded.':target.length?`Current rules would route to <strong>${esc(labelList(target))}</strong>.`:'No current route matches this notification.'}</div><p class="pr-secondary">${n.delivery.length?'Previously forwarded to '+esc(labelList(n.delivery)||'a removed pairing')+'.':'Not forwarded to Telegram.'} Changing a rule affects future notifications.</p><div class="pr-space">${btn('Route notifications like this','create-from',`data-id="${n.id}" ${n.blocked?'disabled':''}`)}</div>`;
    } else if(view?.kind==='route') {
      const categories=[...new Set(samples.filter(n=>draft.app==='Any app'||n.app===draft.app).map(n=>n.category))];
      html=back()+heading(draft.id?'Edit route':'Create route','Choose what matches, then where it goes.')+`<label class="pr-label" for="pr-name">Route name</label><input id="pr-name" type="text" maxlength="60" value="${esc(draft.name)}"><label class="pr-label" for="pr-app">Source app</label><select id="pr-app">${['Any app',...new Set(samples.filter(n=>!n.blocked).map(n=>n.app))].map(a=>`<option ${a===draft.app?'selected':''}>${esc(a)}</option>`).join('')}</select><label class="pr-label" for="pr-category">Notification category</label><select id="pr-category">${['Any category',...categories].map(a=>`<option ${a===draft.category?'selected':''}>${esc(a)}</option>`).join('')}</select><p class="pr-secondary pr-space">Categories are supplied by each app. They may not identify the account.</p><label class="pr-label" for="pr-field">Text condition</label><select id="pr-field"><option value="title" ${draft.field==='title'?'selected':''}>Title contains</option><option value="body" ${draft.field==='body'?'selected':''}>Message contains</option><option value="any" ${draft.field==='any'?'selected':''}>Title or message contains</option></select><input class="pr-space" id="pr-match" type="text" maxlength="100" placeholder="Any text" value="${esc(draft.text)}"><div class="pr-kicker">Forward to</div>${state.pairings.length?state.pairings.map(p=>`<label class="pr-check"><input type="checkbox" data-target="${p.id}" ${draft.targets.includes(p.id)?'checked':''}><span><strong>${esc(p.label)}</strong><br><span class="pr-secondary">${esc(p.name)} · ${esc(p.handle)}</span></span></label>`).join(''):`<p class="pr-secondary">Pair a Telegram account before creating a route.</p>${btn('Add pairing','go-pairings','',true)}`}<div id="pr-match-preview" class="pr-preview" aria-live="polite"></div><div id="pr-error" class="pr-error" role="alert"></div>${btn('Save route','save-route')}<div class="pr-space">${btn('Test with a sample','test-route','',true)}</div>${draft.id?`<button type="button" class="pr-text pr-danger cursor-interaction" data-action="delete-route">Delete route</button>`:''}`;
    } else if(view?.kind==='test') {
      html=back()+heading('Test route','Preview only · nothing will be sent.')+`<label class="pr-label" for="pr-test-sample">Sample notification</label><select id="pr-test-sample">${samples.map(n=>`<option value="${n.id}" ${view.sample===n.id?'selected':''}>${esc(n.app)} · ${esc(n.title)}</option>`).join('')}</select><div id="pr-test-result" aria-live="polite"></div>${btn('Back to route','return-route','',true)}`;
    } else if(view?.kind==='pair') {
      html=back()+heading('Add pairing','Connect a Telegram account to this router.')+`<label class="pr-label" for="pr-pair-label">Label</label><input id="pr-pair-label" type="text" required maxlength="40" placeholder="e.g. Work phone" value="${esc(view.label||'Work phone')}"><div class="pr-card pr-space"><div class="pr-row">${icon('send')}<div><h2>${esc(state.bot)}</h2><p class="pr-secondary">Pairing invitation · expires in 5 minutes</p></div></div><div class="pr-qr">${icon('qr-code')}<span class="pr-secondary">Demo QR preview · not scannable</span></div><p class="pr-small">Scan on the recipient’s phone and tap Start in Telegram.</p><div class="pr-space">${btn('Open Telegram on this phone','simulate-start','',true)}</div></div><p class="pr-secondary">This prototype simulates Telegram. No messages are sent.</p><div class="pr-space">${btn('Simulate recipient joining','simulate-start')}</div>`;
    } else if(view?.kind==='confirm-pair') {
      html=back()+heading('Confirm recipient','Check the identity before allowing forwarding.')+`<div class="pr-card"><div class="pr-row"><div class="pr-app">J</div><div><h2>Jamie Demo</h2><p class="pr-secondary">@jamie_demo · private chat</p></div></div><div class="pr-line"></div><p class="pr-small">Label: <strong>${esc(view.label)}</strong></p><p class="pr-secondary pr-space">No routes are assigned yet. This person receives notifications only after you choose this pairing in a route.</p></div>${btn('Confirm pairing','confirm-pair')}<div class="pr-space">${btn('Reject recipient','reject-pair','',true)}`;
    } else if(view?.kind==='edit-pair') {
      const p=state.pairings.find(p=>p.id===view.id);
      html=back()+heading('Manage pairing',`${esc(p.name)} · ${esc(p.handle)}`)+`<label class="pr-label" for="pr-edit-label">Label</label><input id="pr-edit-label" type="text" required maxlength="40" value="${esc(p.label)}"><div class="pr-space">${btn('Save label','save-label')}</div><div class="pr-line"></div><p class="pr-secondary">Used by ${state.routes.filter(r=>r.targets.includes(p.id)).length} route(s). Removing this pairing stops delivery to it immediately. Routes with no remaining recipients are paused.</p><div class="pr-space">${btn('Remove pairing','remove-pair','',true)}</div>`;
    } else if(view?.kind==='remove-pair') {
      const p=state.pairings.find(p=>p.id===view.id);
      html=back()+heading('Remove pairing?',esc(p.label))+`<div class="pr-card"><p>Forwarding to ${esc(p.name)} will stop.</p><p class="pr-secondary pr-space">Other destinations stay connected. Routes left without a destination will be paused.</p></div>${btn('Remove pairing','confirm-remove')}<div class="pr-space">${btn('Keep pairing','cancel-remove','',true)}</div>`;
    } else if(view?.kind==='change-bot') {
      html=back()+heading('Replace router bot?','Existing pairings belong to the current bot.')+`<div class="pr-card"><p>Switching to @new_demo_router_bot will disconnect ${state.pairings.length} pairing(s) and pause all routes.</p><p class="pr-secondary pr-space">Pair each recipient with the new bot, then choose their destinations again.</p></div>${btn('Replace bot & disconnect','confirm-bot')}<div class="pr-space">${btn('Keep current bot','back','',true)}</div>`;
    } else if(state.tab==='notifications') {
      html=heading('Notifications','Seen on this phone · today')+`<div class="pr-banner">${icon(state.access?'radio':'bell-off')}<span>${!state.access?'Notification access is off. Enable it in Settings.':state.paused?'Forwarding paused · notifications still collected.':'Listening · new notifications follow your active routes.'}</span></div><div class="pr-filters">${[['all','All'],['forwarded','Forwarded'],['local','Not forwarded']].map(([v,l])=>`<button type="button" class="pr-pill cursor-interaction" data-filter="${v}" aria-pressed="${state.filter===v}">${l}</button>`).join('')}</div><div class="pr-kicker">Recent notifications</div>${samples.filter(n=>state.filter==='all'||(state.filter==='forwarded'?n.delivery.length:!n.delivery.length)).map(n=>`<button type="button" class="pr-card pr-notification cursor-interaction" data-action="detail" data-id="${n.id}"><div class="pr-row"><span class="pr-app">${n.initial}</span><span class="pr-grow"><strong>${n.app}</strong><br><span class="pr-secondary">${n.category}</span></span><span class="pr-secondary">${n.time}</span></div><div class="pr-message"><h2>${n.title}</h2><p class="pr-small">${n.body}</p></div><span class="pr-status ${!n.delivery.length?'pr-idle':''}">${icon(n.blocked?'lock-keyhole':n.delivery.length?'arrow-up-right':'circle-minus')}${n.blocked?'Content unavailable':n.delivery.length?'Forwarded → '+esc(labelList(n.delivery)||'Removed pairing'):'Not forwarded'}</span></button>`).join('')}`;
    } else if(state.tab==='routes') {
      html=heading('Routes','Match notifications. Choose their destinations.')+btn(`${icon('plus')} Create route`,'new-route')+`<div class="pr-kicker">Your routes</div>${state.routes.length?state.routes.map(r=>`<div class="pr-card"><div class="pr-row"><h2 class="pr-grow">${esc(r.name)}</h2><label class="pr-switch"><input type="checkbox" data-route-toggle="${r.id}" aria-label="Enable ${esc(r.name)}" ${r.enabled?'checked':''} ${!r.targets.length?'disabled':''}></label></div><p class="pr-secondary">${esc(r.app)} · ${esc(r.category)}</p>${r.text?`<p class="pr-small pr-space">${r.field==='title'?'Title':r.field==='body'?'Message':'Title or message'} contains “${esc(r.text)}”</p>`:''}<div class="pr-row pr-space"><span class="pr-grow pr-small pr-long">${icon('arrow-right')} ${esc(labelList(r.targets)||'Choose a pairing')}</span><button type="button" class="pr-text cursor-interaction" data-action="edit-route" data-id="${r.id}">Edit</button></div><p class="pr-secondary">${!r.enabled?'Paused':state.paused?'Global forwarding paused':!state.access?'Waiting for notification access':'Active · future notifications'}</p></div>`).join(''):'<p class="pr-empty">No routes yet. Pick a notification to get started.</p>'}<p class="pr-secondary pr-space">If several rules match, each destination receives one copy. Unmatched notifications stay on this device.</p>`;
    } else if(state.tab==='pairings') {
      html=heading('Pairings','Telegram accounts you can route to.')+btn(`${icon('plus')} Add pairing`,'add-pair')+`<div class="pr-kicker">Connected through ${esc(state.bot)}</div>${state.pairings.length?state.pairings.map(p=>`<div class="pr-card"><div class="pr-row"><div class="pr-app">${esc(p.name[0])}</div><div class="pr-grow"><h2>${esc(p.label)}</h2><p class="pr-secondary">${esc(p.name)} · ${esc(p.handle)}</p></div></div><div class="pr-row pr-space"><span class="pr-tag">Paired</span><span class="pr-secondary pr-grow">${state.routes.filter(r=>r.targets.includes(p.id)).length} route(s)</span><button type="button" class="pr-text cursor-interaction" data-action="edit-pair" data-id="${p.id}">Manage</button></div></div>`).join(''):'<p class="pr-empty">No accounts paired. Create an invitation to connect one.</p>'}<p class="pr-secondary pr-space">Labels are for you. Each pairing is bound to the confirmed Telegram identity.</p>`;
    } else {
      html=heading('Settings','Your notification access and router bot.')+`<div class="pr-kicker">This phone</div><div class="pr-card"><label class="pr-check"><span class="pr-grow"><strong>Notification access</strong><br><span class="pr-secondary">${state.access?'Allowed · listening for new notifications':'Off · no new notifications collected'}</span></span><input type="checkbox" id="pr-access" ${state.access?'checked':''}></label><p class="pr-secondary">Demo switch. In the Android app, this opens system settings.</p></div><div class="pr-kicker">Telegram bot</div><div class="pr-card"><div class="pr-row">${icon('bot')}<div class="pr-grow"><h2>${esc(state.bot)}</h2><p class="pr-secondary">Configured · demo connection</p></div></div><label class="pr-label" for="pr-token">Bot token</label><input id="pr-token" type="password" placeholder="Demo only — do not enter a real token" autocomplete="off"><p class="pr-secondary pr-space">Use “demo” to try the setup flow. Tokens are never saved in this prototype.</p><div id="pr-error" class="pr-error" role="alert"></div><div class="pr-space">${btn('Check demo token','check-token','',true)}</div>${tokenStage?`<div class="pr-notice">Demo bot verified: @new_demo_router_bot</div>${btn('Use this bot','use-bot')}`:''}</div><p class="pr-secondary">Sensitive content hidden by Android is skipped. Notifications from the router itself are excluded to prevent forwarding loops.</p>`;
    }
    if(notice) html+=`<div class="pr-notice" role="status">${esc(notice)}</div>`;
    content.innerHTML=html;
    if(view?.kind==='route') updatePreview();
    if(view?.kind==='test') updateTest();
    if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
  }
  function syncDraft() { if(view?.kind!=='route')return; draft.name=content.querySelector('#pr-name').value; draft.app=content.querySelector('#pr-app').value; draft.category=content.querySelector('#pr-category').value; draft.text=content.querySelector('#pr-match').value; draft.field=content.querySelector('#pr-field').value; draft.targets=[...content.querySelectorAll('[data-target]:checked')].map(e=>e.dataset.target); }
  function updatePreview() { const hit=samples.filter(n=>matches(draft,n)); content.querySelector('#pr-match-preview').innerHTML=`<strong>${hit.length} of ${samples.length} samples match</strong><br>${draft.targets.length?'Future matches → '+esc(labelList(draft.targets)):'Choose at least one pairing.'}`; }
  function updateTest() { const n=samples.find(n=>n.id===(view.sample||'n1')); const pass=matches(draft,n); content.querySelector('#pr-test-result').innerHTML=`<div class="pr-card pr-space"><h2>${esc(n.title)}</h2><p class="pr-small">${esc(n.body)}</p></div><div class="pr-preview"><strong>${n.blocked?'Skipped · hidden content':pass?'Matches this route':'Does not match'}</strong><br>${pass?(draft.targets.length?'Would forward to '+esc(labelList(draft.targets)):'No destination selected'):'No forwarding for this sample.'}</div>`; }
  function error(msg){const el=content.querySelector('#pr-error');if(el)el.textContent=msg;}
  root.addEventListener('input',e=>{if(view?.kind==='route' && ['pr-name','pr-match'].includes(e.target.id)){syncDraft();updatePreview();}});
  root.addEventListener('change',e=>{
    if(view?.kind==='route'){syncDraft();if(e.target.id==='pr-app'){draft.category='Any category';render();}else updatePreview();}
    if(e.target.id==='pr-test-sample'){view.sample=e.target.value;updateTest();}
    if(e.target.dataset.routeToggle){state.routes.find(r=>r.id===e.target.dataset.routeToggle).enabled=e.target.checked;render();save();}
    if(e.target.id==='pr-access'){state.access=e.target.checked;render();save();}
  });
  root.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b||!root.contains(b))return;
    if(b.dataset.tab){state.tab=b.dataset.tab;view=null;notice='';tokenStage=false;render();save();return;}
    if(b.dataset.filter){state.filter=b.dataset.filter;render();save();return;}
    const a=b.dataset.action; notice='';
    if(a==='pause'){state.paused=!state.paused;save();}
    if(a==='back'){if(view?.kind==='test'){view={kind:'route'};}else view=null;tokenStage=false;}
    if(a==='detail')view={kind:'detail',id:b.dataset.id};
    if(a==='create-from'){routeDraft(samples.find(n=>n.id===b.dataset.id));return;}
    if(a==='new-route'){routeDraft();return;}
    if(a==='edit-route'){routeDraft(null,state.routes.find(r=>r.id===b.dataset.id));return;}
    if(a==='save-route'){syncDraft();if(!draft.name.trim())return error('Give this route a name.');if(!draft.targets.length)return error('Select at least one pairing.');draft.name=draft.name.trim();if(draft.id)state.routes[state.routes.findIndex(r=>r.id===draft.id)]=structuredClone(draft);else{draft.id='r'+Date.now();state.routes.push(structuredClone(draft));}view=null;state.tab='routes';notice='Route saved. Only future notifications will be routed.';save();}
    if(a==='test-route'){syncDraft();view={kind:'test',sample:view.sample||'n1'};}
    if(a==='return-route')view={kind:'route'};
    if(a==='delete-route'){state.routes=state.routes.filter(r=>r.id!==draft.id);view=null;state.tab='routes';notice='Route removed.';save();}
    if(a==='go-pairings'){state.tab='pairings';view=null;save();}
    if(a==='add-pair')view={kind:'pair'};
    if(a==='simulate-start'){const label=content.querySelector('#pr-pair-label').value.trim();if(!label){content.querySelector('#pr-pair-label').reportValidity();return;}view={kind:'confirm-pair',label};}
    if(a==='reject-pair'){view={kind:'pair',label:view.label};notice='Recipient rejected. Create another invitation.';}
    if(a==='confirm-pair'){if(state.pairings.some(p=>p.handle==='@jamie_demo')){view=null;notice='Jamie is already paired. Manage the existing pairing.';}else{state.pairings.push({id:'p'+Date.now(),label:view.label,name:'Jamie Demo',handle:'@jamie_demo'});view=null;notice='Pairing confirmed. You can now select it in a route.';}save();}
    if(a==='edit-pair')view={kind:'edit-pair',id:b.dataset.id};
    if(a==='save-label'){const value=content.querySelector('#pr-edit-label').value.trim();if(!value){content.querySelector('#pr-edit-label').reportValidity();return;}state.pairings.find(p=>p.id===view.id).label=value;view=null;notice='Label updated everywhere this pairing is used.';save();}
    if(a==='remove-pair')view={kind:'remove-pair',id:view.id};
    if(a==='cancel-remove')view={kind:'edit-pair',id:view.id};
    if(a==='confirm-remove'){const id=view.id;state.pairings=state.pairings.filter(p=>p.id!==id);state.routes.forEach(r=>{r.targets=r.targets.filter(t=>t!==id);if(!r.targets.length)r.enabled=false;});view=null;notice='Pairing removed. Delivery to this account has stopped.';save();}
    if(a==='check-token'){const token=content.querySelector('#pr-token').value;content.querySelector('#pr-token').value='';if(token!=='demo')return error('Enter “demo” to explore setup. Real tokens are not accepted.');tokenStage=true;}
    if(a==='use-bot')view={kind:'change-bot'};
    if(a==='confirm-bot'){state.bot='@new_demo_router_bot';state.pairings=[];state.routes.forEach(r=>{r.targets=[];r.enabled=false;});view=null;tokenStage=false;notice='Bot replaced. Pair recipients again to resume routing.';save();}
    render();
  });
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
  render();
  if(globalThis.Tweak){const design={density:'Comfortable',corners:28};const phone=root.querySelector('.pr-phone');const tweak=new Tweak({container:phone,onChange:()=>{phone.style.setProperty('--pr-gap',design.density==='Compact'?'12px':'16px');phone.style.borderRadius=design.corners+'px';}});tweak.addSelect(design,'density',{label:'List density',options:['Comfortable','Compact']});tweak.addSlider(design,'corners',{label:'Frame corners',min:0,max:32,unit:'px'});}
})();
</script>
